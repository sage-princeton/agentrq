name: Crux release

# Builds the control-plane image crux-control runs. A crux-v<version> tag on a
# crux/* branch becomes a GitHub release carrying the linux/amd64 image as a
# docker save tarball and its sha256, which provisioning pins. Nothing is
# pushed to a registry.

on:
  push:
    tags:
      - 'crux-v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches CRUX_VERSION
        run: |
          VERSION=$(cat CRUX_VERSION)
          [ "$GITHUB_REF_NAME" = "crux-v$VERSION" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match CRUX_VERSION $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install mockgen
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install "github.com/golang/mock/mockgen@$(go list -m -f '{{.Version}}' github.com/golang/mock)"
        working-directory: backend

      - name: Generate mocks
        run: make mocks

      - name: Run tests
        run: go test ./internal/...
        working-directory: backend

      - name: Build and save the image
        run: |
          IMAGE="agentrq-crux:$VERSION"
          TARBALL="agentrq-crux-$VERSION-linux-amd64.tar.gz"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker save "$IMAGE" | gzip -n > "$TARBALL"
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          cat "$TARBALL.sha256"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA by this workflow. Check the tarball's sha256 against the .sha256 asset, then docker load it; it loads as $IMAGE."
